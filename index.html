<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e2a1c">
  <meta name="description" content="Castelinho Vivo — Desafios da Aventura. Um jogo sobre a história de Erechim e do Castelinho.">
  <title>Castelinho Vivo — Desafios da Aventura</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0e2a1c; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #0e2a1c; outline: none; }
    #loader { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(ellipse at center, #1f5a3c 0%, #123a27 55%, #0e2a1c 100%); color: #faf0d7;
      font-family: "Trebuchet MS", system-ui, -apple-system, sans-serif; transition: opacity .7s ease; text-align: center; padding: 16px; box-sizing: border-box; }
    #loader.hide { opacity: 0; pointer-events: none; }
    #title { font-size: clamp(30px, 6vw, 72px); font-weight: 800; letter-spacing: .5px; text-shadow: 0 3px 0 #0a1f14, 0 0 24px rgba(234,199,134,.35); }
    #sub { font-size: clamp(16px, 2.4vw, 26px); color: #ebc786; margin-top: -10px; }
    #bar { width: min(70vw, 560px); height: 18px; border-radius: 12px; background: rgba(255,255,255,.12); overflow: hidden; border: 2px solid #c2702e; }
    #fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ebc786, #c2702e); transition: width .25s ease; }
    #pct { font-size: 16px; opacity: .85; min-height: 20px; }
    #hint { font-size: 14px; opacity: .6; max-width: 520px; }
    #fs { position: fixed; right: 14px; bottom: 14px; z-index: 6; width: 46px; height: 46px; border-radius: 50%; border: 2px solid #c2702e;
      background: rgba(14,42,28,.75); color: #faf0d7; font-size: 22px; cursor: pointer; display: none; align-items: center; justify-content: center; }
    #fs:hover { background: rgba(31,90,60,.9); }
    #err { display: none; color: #ffd2c4; max-width: 560px; font-size: 16px; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <div id="title">Castelinho Vivo</div>
    <div id="sub">Desafios da Aventura</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="pct">Carregando…</div>
    <div id="hint">Ligue o som. Na primeira vez o jogo leva alguns instantes para abrir.</div>
    <div id="err"></div>
  </div>
  <button id="fs" title="Tela cheia" aria-label="Tela cheia">&#x26F6;</button>
  <script>
    var canvas = document.getElementById("unity-canvas");
    var loader = document.getElementById("loader");
    var fill = document.getElementById("fill");
    var pct = document.getElementById("pct");
    var fsBtn = document.getElementById("fs");
    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/Web.data.unityweb",
      frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
      codeUrl: buildUrl + "/Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Delumo",
      productName: "Castelinho Vivo",
      productVersion: "1.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    function showError(msg) {
      var e = document.getElementById("err");
      e.style.display = "block";
      e.textContent = "Não foi possível abrir o jogo neste navegador. Tente o Chrome, o Edge ou o Firefox atualizados. (" + msg + ")";
    }

    var script = document.createElement("script");
    script.src = buildUrl + "/Web.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        var p = Math.round(progress * 100);
        fill.style.width = p + "%";
        pct.textContent = p < 100 ? "Carregando… " + p + "%" : "Preparando o Castelinho…";
      }).then(function (instance) {
        window.unityInstance = instance;
        loader.classList.add("hide");
        setTimeout(function () { loader.remove(); }, 800);
        fsBtn.style.display = "flex";
        fsBtn.onclick = function () { instance.SetFullscreen(1); };
        canvas.focus();
      }).catch(function (message) { showError(message); });
    };
    script.onerror = function () { showError("arquivos do jogo não encontrados"); };
    document.body.appendChild(script);

    document.addEventListener("fullscreenchange", function () {
      fsBtn.style.display = document.fullscreenElement ? "none" : "flex";
    });
  </script>
</body>
</html>
